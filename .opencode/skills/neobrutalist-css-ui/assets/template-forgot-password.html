<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="neobrutalist.css">
</head>
<body class="nb" style="background:#000">
  <main class="nb-auth">
    <section class="nb-auth__form-panel">
      <form class="nb-auth__form" novalidate>
        <h1 class="nb-auth__heading">Forgot your password?</h1>
        <p class="nb-auth__subheading">Enter your Email and get OTP to verification.</p>

        <label class="nb-field nb-field--faint-icon">
          <span class="nb-sr-only">Email</span>
          <svg class="nb-icon nb-field__icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input class="nb-field__input" type="email" placeholder="Email" autocomplete="email" required>
        </label>
        <label class="nb-field nb-field--faint-icon">
          <span class="nb-sr-only">Repeat email</span>
          <svg class="nb-icon nb-field__icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input class="nb-field__input" type="email" placeholder="Repeat Email" autocomplete="off" required>
        </label>

        <button type="submit" class="nb-btn nb-btn--solid nb-btn--block">Get OTP</button>
      </form>
    </section>

    <aside class="nb-showcase" aria-label="Help">
      <div class="nb-orb" role="presentation"></div>
      <div class="nb-showcase__caption">
        <h2 class="nb-showcase__title">Forgot your password?</h2>
        <p class="nb-showcase__text">You can get them back easily.</p>
        <div class="nb-dots">
          <button class="nb-dots__dot" aria-current="true" aria-label="Slide 1"></button>
          <button class="nb-dots__dot" aria-label="Slide 2"></button>
          <button class="nb-dots__dot" aria-label="Slide 3"></button>
        </div>
      </div>
    </aside>
  </main>
</body>
</html>
